<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Course Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }
        h2 {
            color: #667eea;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section ul {
            list-style: none;
            padding-left: 0;
        }
        .section li {
            margin: 8px 0;
        }
        .section a {
            display: inline-block;
            padding: 10px 15px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
            margin-right: 10px;
        }
        .section a:hover {
            background-color: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Course Website</h1>
        <p class="subtitle">Organized coursework - Checkpoints, Assignments and Group Project</p>
        
        <h2>Chapters</h2>
        <div class="section">
            <ul>
                <li><a href="chapter2/index.html">Chapter 2</a></li>
                <li><a href="chapter3/index.html">Chapter 3</a></li>
            </ul>
        </div>
        
        <h2>Group Project</h2>
        <div class="section">
            <ul>
                <li><a href="project/group-project/">View Group Project</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
